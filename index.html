<script>
(()=>{'use strict';
const app=document.querySelector('#app');if(!app||app.dataset.ready)return;app.dataset.ready='1';
const $=s=>app.querySelector(s);
let stage=0,friction=20,lossActive=false;
const stories=[
 {label:'01 · FOLLOW THE FLUID',title:'One loop. Two directions.',copy:'Mud moves down the drillpipe, exits through the bit, and returns up the annulus with rock cuttings.',deep:'Mud circulation cools the bit, carries cuttings and contributes to pressure control. In this illustration, mud goes down the drillpipe and through the PDC bit nozzles. The returning mud carries cuttings up the annulus. Actual hole cleaning depends on flow rate, fluid properties, hole inclination and geometry.'},
 {label:'02 · KNOW THE TOOLS',title:'The action is at the bit.',copy:'A PDC bit shears rock. Drill collars and stabilizers are part of the BHA. The casing shoe marks the end of installed casing.',deep:'A polycrystalline diamond compact (PDC) bit uses fixed cutters to shear rock. The bottomhole assembly (BHA) can include collars, stabilizers, motors and sensors. Below the casing shoe, the exposed hole needs separate formation integrity assessment. The top-view is a simplified illustrative bit, not a supplier tool drawing.'},
 {label:'03 · PRESSURE WINDOW',title:'Circulation adds pressure.',copy:'At 2,500 m, friction in the annulus increases pressure while pumping. ECD expresses that added pressure as density.',deep:'In this simplified model, ECD (SG) = mud density (1.200 SG) + annular friction (bar) ÷ (0.0980665 × TVD in m). The selected depth is 2,500 m. The upper formation equivalent density is assumed to be 1.350 SG, giving a threshold of about 36.8 bar. Other formation depths and transient effects are not calculated.'},
 {label:'04 · LOSS RISK',title:'Where does lost mud go?',copy:'Too much wellbore pressure can lead to losses into exposed rock. Explore one possible fracture-flow scenario.',deep:'Exceeding a hypothetical formation limit does not automatically mean a fracture opens. In the optional example event, an existing or developing conductive fracture allows drilling fluid to enter the rock. Returns may fall. It is only a qualitative illustration, not a fracture-initiation or leak-rate calculation.'},
 {label:'05 · THE BIG PICTURE',title:'A well remembers its past.',copy:'Drilling conditions affect cement placement, barrier decisions and P&A years later. Understanding the well starts here.',deep:'Engineers planning P&A must consider the as-built well, exposed zones, casing and cement quality, pressure sources and historical integrity evidence. A circulation or losses problem during drilling can influence later decisions, but the impact must be evaluated using the actual well records. No animated model alone qualifies a well barrier.'}
];
function show(i){stage=Math.max(0,Math.min(stories.length-1,i));lossActive=false;app.classList.remove('loss-on');app.dataset.stage=String(stage);const x=stories[stage];$('#sceneTag').textContent=x.label;$('#kicker').textContent=`INSIGHT ${String(stage+1).padStart(2,'0')} / 05`;$('#heading').textContent=x.title;$('#description').textContent=x.copy;$('#statePill').textContent=stage===3?'● SCENARIO':stage===2?'● LIVE ECD':'● CIRCULATING';$('#prev').disabled=stage===0;$('#next').textContent=stage===4?'Replay story ↻':'Next insight →';$('#lossButton').textContent='Play a possible loss event';app.querySelectorAll('.step').forEach((e,j)=>e.classList.toggle('active',j<=stage));calc();try{$('#save').textContent=localStorage.getItem('the-well-saved-'+stage)==='yes'?'♥ Saved':'♡ Save insight'}catch(e){};}
function calc(){const ecd=1.2+friction/(.0980665*2500),over=ecd>1.35;$('#lossValue').textContent=friction+' bar';$('#ecdSvg').textContent=ecd.toFixed(3);$('#ecdBar').setAttribute('width',String(Math.max(6,Math.min(97,97*(ecd-1.0)/.48))));$('#ecdBar').setAttribute('fill',over?'#f28b68':'#51dbad');$('#ecdState').textContent=over?'ABOVE EXAMPLE LIMIT':'WITHIN MODEL LIMIT';$('#ecdState').setAttribute('fill',over?'#ff9b79':'#6be3bd');}
$('#next').onclick=()=>show(stage===4?0:stage+1);$('#prev').onclick=()=>show(stage-1);$('#friction').oninput=e=>{friction=Number(e.target.value);calc()};
$('#lossButton').onclick=()=>{lossActive=!lossActive;app.classList.toggle('loss-on',lossActive);$('#lossButton').textContent=lossActive?'Stop the example event':'Play a possible loss event';};
$('#deeper').onclick=()=>{$('#deepHeading').textContent=stories[stage].title;$('#deepBody').textContent=stories[stage].deep;$('#deep').classList.add('open');$('#deepClose').focus()};$('#deepClose').onclick=()=>$('#deep').classList.remove('open');
$('#save').onclick=()=>{let saved=false;try{saved=localStorage.getItem('the-well-saved-'+stage)==='yes';localStorage.setItem('the-well-saved-'+stage,saved?'no':'yes')}catch(e){}$('#save').textContent=saved?'♡ Save insight':'♥ Saved'};
let sx=0;$('#scene').addEventListener('touchstart',e=>{sx=e.touches[0]?.clientX||0},{passive:true});$('#scene').addEventListener('touchend',e=>{const d=(e.changedTouches[0]?.clientX||0)-sx;if(Math.abs(d)>65)show(stage+(d<0?1:-1))},{passive:true});
window.addEventListener('keydown',e=>{if(e.key==='Escape')$('#deep').classList.remove('open');if($('#deep').classList.contains('open'))return;if(e.key==='ArrowRight')show(stage+1);if(e.key==='ArrowLeft')show(stage-1)});
show(0);
})();
